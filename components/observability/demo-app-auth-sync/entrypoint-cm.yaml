apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-auth-sync-script
data:
  run.sh: |
    #!/bin/sh
    set -e
    NAMESPACE="${POD_NAMESPACE:-monitoring}"
    SECRET_NAME="bw-basic-auth"
    CONFIGMAP_NAME="demo-app-generated-auth"
    HTPASSWD_FILE="/tmp/htpasswd"
    AUTH_LIST="/tmp/auth-list.txt"

    echo "Generating 10 random users for basic auth (namespace=$NAMESPACE)..."

    : > "$HTPASSWD_FILE"
    : > "$AUTH_LIST"

    for i in $(seq 1 10); do
      user="demouser$(printf '%02d' "$i")"
      pass=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 16)
      # MD5 crypt (nginx basic auth compatible)
      hash=$(openssl passwd -1 "$pass")
      echo "${user}:${hash}" >> "$HTPASSWD_FILE"
      # Store user:base64(pass) for reference in ConfigMap
      echo "${user}:$(echo -n "$pass" | base64)" >> "$AUTH_LIST"
    done

    echo "Creating/updating Secret ${SECRET_NAME}..."
    kubectl create secret generic "$SECRET_NAME" \
      --from-file=auth-file="$HTPASSWD_FILE" \
      --namespace="$NAMESPACE" \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "Creating/updating ConfigMap ${CONFIGMAP_NAME}..."
    kubectl create configmap "$CONFIGMAP_NAME" \
      --from-file=htpasswd="$HTPASSWD_FILE" \
      --from-file=credentials="$AUTH_LIST" \
      --namespace="$NAMESPACE" \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "Done. Secret used by external ingress; ConfigMap holds reference copy."
