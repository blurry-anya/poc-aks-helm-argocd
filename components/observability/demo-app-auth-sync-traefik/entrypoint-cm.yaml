apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-auth-sync-traefik-script
data:
  run.sh: |
    #!/bin/sh
    set -e
    NAMESPACE="${POD_NAMESPACE}"
    AUTH_DATA_DIR="${AUTH_DATA_DIR:-/data/auth}"
    TOTAL_USERS=20
    # One run: produce users-stage.htpasswd and users-prod.htpasswd + reference ConfigMaps for both
    AUTH_ENVS="${AUTH_ENVS:-stage prod}"

    mkdir -p "$AUTH_DATA_DIR"

    for AUTH_ENV in $AUTH_ENVS; do
      HTPASSWD_FILE="${AUTH_DATA_DIR}/users-${AUTH_ENV}.htpasswd"
      AUTH_LIST="${AUTH_DATA_DIR}/credentials-${AUTH_ENV}.txt"
      CONFIGMAP_NAME="demo-app-generated-auth-${AUTH_ENV}"

      echo "Writing ${TOTAL_USERS} users (env=${AUTH_ENV}) to ${HTPASSWD_FILE}..."
      : > "$HTPASSWD_FILE"
      : > "$AUTH_LIST"

      for i in $(seq 1 $TOTAL_USERS); do
        user="demouser$(printf '%02d' "$i")"
        pass=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 16)
        htpasswd -nb "$user" "$pass" >> "$HTPASSWD_FILE"
        echo "${user}:$(echo -n "$pass" | base64)" >> "$AUTH_LIST"
      done

      echo "Creating/updating ConfigMap ${CONFIGMAP_NAME} in ${NAMESPACE}..."
      kubectl create configmap "$CONFIGMAP_NAME" \
        --from-file=credentials="$AUTH_LIST" \
        --namespace="$NAMESPACE" \
        --dry-run=client -o yaml | kubectl apply -f -

      echo "Done env=${AUTH_ENV}. Traefik middleware my-basic-auth-${AUTH_ENV}@file uses ${HTPASSWD_FILE}."
    done
