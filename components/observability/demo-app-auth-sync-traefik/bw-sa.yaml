apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app-auth-sync-traefik-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-app-auth-sync-traefik-role
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-app-auth-sync-traefik-rb
subjects:
  - kind: ServiceAccount
    name: demo-app-auth-sync-traefik-sa
roleRef:
  kind: Role
  name: demo-app-auth-sync-traefik-role
  apiGroup: rbac.authorization.k8s.io
