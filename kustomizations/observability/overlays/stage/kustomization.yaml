apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring-stage

labels:
  - includeSelectors: true
    pairs:
      env: stage

components:
  - ../../../../components/observability/demo-app-auth-sync-traefik

resources:
  # ForwardAuth: multiple secrets (bw-basic-auth-1..4, 5 users each)
  - forwardauth-script-cm.yaml
  - forwardauth-deployment.yaml
  - middleware-forwardauth.yaml
  - ingress-echo-app.yaml
  # Debug: no-auth ingress to test backend (remove when done)
  - ingress-echo-app-debug-noauth.yaml
