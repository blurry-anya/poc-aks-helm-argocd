apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-app-stage-ingress-external
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # ForwardAuth: validates against multiple bw-basic-auth-* secrets (5 users each)
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-stage-echo-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik-argocd
  rules:
    - host: demoapp.sixthnode.external.stage.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-server
                port:
                  number: 80
