apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: infrastructure
  # Single app: Helm chart (values from repo) + auth PVC/CronJob (kustomizations/traefik-auth) in traefik namespace
  sources:
    - repoURL: https://github.com/sixthnode/poc-aks-helm-argocd.git
      path: charts/traefik
      targetRevision: HEAD
      ref: values
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "39.0.0"
      helm:
        releaseName: traefik
        valueFiles:
          - $values/charts/traefik/values.yaml
    - repoURL: https://github.com/sixthnode/poc-aks-helm-argocd.git
      path: kustomizations/traefik-auth
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
