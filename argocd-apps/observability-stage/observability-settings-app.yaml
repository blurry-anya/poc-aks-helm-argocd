apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-stage-settings-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: observability-stage
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-stage
  source:
    repoURL: 'https://github.com/sixthnode/poc-aks-helm-argocd.git'
    path: kustomizations/observability/overlays/stage
    targetRevision: HEAD
  # Avoid sync loop: Ingress status and server-managed metadata change (Traefik, resourceVersion)
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /status
        - /metadata/resourceVersion
        - /metadata/generation
        - /metadata/uid
        - /metadata/creationTimestamp
        - /metadata/managedFields
  syncPolicy:
    automated:
      # Prune off: demo-app also deploys to monitoring-stage; pruning would remove its resources
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

