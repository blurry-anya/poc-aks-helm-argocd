apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: observability-stage
  source:
    repoURL: 'https://github.com/sixthnode/poc-aks-helm-argocd.git'
    path: manifests/demo-app
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-stage
  syncPolicy:
    automated:
      # Prune disabled: observability-stage-settings-app also deploys to monitoring-stage
      # (Middleware, Ingress, auth-sync). Pruning would delete those and cause sync thrashing.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
