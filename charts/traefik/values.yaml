# Traefik: run alongside ingress-nginx. For AKS: service.type LoadBalancer, optional loadBalancerIP.

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-argocd

rbac:
  namespaced: false

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-argocd
    namespaces: []
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-argocd
    namespaces: []
  kubernetesGateway:
    enabled: false
  file:
    enabled: true
    watch: true
    content: |
      http:
        middlewares:
          my-basic-auth-stage:
            basicAuth:
              usersFile: "/etc/traefik/auth/users-stage.htpasswd"
          my-basic-auth-prod:
            basicAuth:
              usersFile: "/etc/traefik/auth/users-prod.htpasswd"

deployment:
  additionalVolumes:
    - name: auth-users
      persistentVolumeClaim:
        claimName: traefik-auth-htpasswd-pvc

additionalVolumeMounts:
  - name: auth-users
    mountPath: /etc/traefik/auth

service:
  type: NodePort
  # AKS: type: LoadBalancer
  # loadBalancerIP: <your-static-ip>
