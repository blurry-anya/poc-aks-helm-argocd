apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-server
      app.kubernetes.io/name: echo-server
      app.kubernetes.io/part-of: demo-app
  template:
    metadata:
      labels:
        app: echo-server
        app.kubernetes.io/name: echo-server
        app.kubernetes.io/part-of: demo-app
    spec:
      containers:
        - name: echo-server
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
